<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List Kosakata Bahasa Jepang</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="header-controls">
        <button id="btn-play-all">▶ Play Dari Awal</button>
        <button id="btn-pause" class="btn-pause" disabled>⏸ Pause</button>
        <button id="btn-stop" class="btn-stop" disabled>⏹ Stop</button>
        <!-- Tombol yang sebelumnya hilang ada di sini: -->
        <button id="btn-open-quiz" style="background-color: #28a745;">🧠 Mulai Quiz</button>
        <button id="btn-open-checklist" style="background-color: #ffc107; color: #333; font-weight: bold;">✅ Progress Hafalan</button>
        <label style="margin-left: 10px; font-size: 0.9em; cursor: pointer;">
            <input type="checkbox" id="chk-indonesia" checked> 
            Bacakan Bahasa Indonesia
        </label>

            <div class="filter-container">
            <label for="selectKategori">Pilih Kategori:</label>
            <select id="selectKategori">
                <option value="all">Semua Kategori</option>
                <!-- Opsi kategori lainnya akan diisi otomatis oleh JavaScript -->
            </select>
            </div>
            <div class="sticky-action-bar">
                <!-- Tombol Toggle Furigana (Sisi Kanan) -->
                <div class="toggle-container">
                <span class="toggle-label">Furigana</span>
                <label class="switch">
                <input type="checkbox" id="furiganaToggle" checked onclick="toggleFurigana()">
                <span class="slider round"></span>
                </label>
                </div>
            </div>
    </div>

    <div id="list-container"></div>

<!-- Modal Quiz -->
<div id="quiz-modal" class="modal">
    <div class="modal-content">
        <span class="close-btn" onclick="closeQuiz()">&times;</span>
        
        <!-- Layar Setup Quiz -->
        <div id="quiz-setup">
            <h2>Pilih Jumlah Soal</h2>
            <p>Silakan pilih berapa banyak soal yang ingin dikerjakan:</p>
            <button onclick="startQuiz(10)">10 Soal</button>
            <button onclick="startQuiz(20)">20 Soal</button>
            <button onclick="startQuiz(30)">30 Soal</button>
        </div>

        <!-- Layar Aktif Quiz -->
        <div id="quiz-active" style="display: none;">
            <div class="quiz-header-controls">
                <h3 id="quiz-progress" class="quiz-progress-title">Soal 1 / 10</h3>
                <div class="quiz-action-buttons">
                <button id="btn-toggle-furigana" class="furigana-toggle-btn" onclick="toggleQuizFurigana()">Furigana: OFF</button>
                <button id="btn-toggle-id" class="id-toggle-btn" onclick="toggleQuizTranslation()">Arti: OFF</button>
            </div>
        </div>

            <div id="quiz-question-box" style="margin-top: 10px;">
                <div class="q-jp hide-furigana" id="quiz-text-jp"></div>
                <div class="q-id" id="quiz-text-id"></div>
                <button onclick="speakQuestion()" style="background-color: #17a2b8; padding: 6px 12px; font-size: 1.1em; flex-shrink: 0;" title="Dengarkan Soal">🔊</button>
            </div>
            <div id="quiz-options-container" class="hide-furigana"></div>
            <div style="margin-top: 20px; text-align: right;">
                <button id="btn-next-question" style="display: none;" onclick="nextQuestion()">Selanjutnya ➔</button>
            </div>
        </div>

        <!-- Layar Hasil Quiz -->
        <div id="quiz-result" style="display: none; text-align: center;">
            <h2>Quiz Selesai! 🎉</h2>
            <h1 id="quiz-score" style="font-size: 3em; color: #28a745;"></h1>
            <p id="quiz-feedback"></p>
            <button onclick="closeQuiz()">Tutup</button>
            <button onclick="document.getElementById('quiz-result').style.display='none'; document.getElementById('quiz-setup').style.display='block';">Main Lagi</button>
        </div>
    </div>
</div>

    <!-- Modal checklist hafalan -->
    <div id="checklist-modal" class="modal" style="display: none;">
    <div class="modal-content" style="max-width: 500px;">
        <span class="close-btn" onclick="closeChecklist()">&times;</span>
        <h2 style="margin-top: 0;">Progress Hafalan</h2>
        <p style="color: #666; font-size: 0.9em;">Tandai kosakata yang sudah kamu hafal. Data otomatis tersimpan.</p>
        
        <!-- Wadah List Checkbox -->
        <div id="checklist-container" style="max-height: 400px; overflow-y: auto; text-align: left; margin-top: 15px; border-top: 1px solid #ddd; padding-top: 10px;">
            <!-- Checkbox akan dimunculkan oleh JavaScript di sini -->
        </div>
    </div>
    </div>

    <!-- BANNER PERINGATAN IN-APP BROWSER -->
    <div id="iab-warning" class="iab-banner" style="display: none;">
        <div class="iab-content">
            <span>💡 <strong>Saran:</strong> Buka di Chrome/Safari agar fitur audio & kuis berjalan lancar.</span>
        </div>
        <button id="close-iab-btn" class="iab-close">&times;</button>
    </div>



    <script src="dataKosakata.js"></script>
    <script src="script.js"></script>
</body>
</html>
